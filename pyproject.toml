[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cleave"
version = "0.1.0"
description = "A minimal unified Python interface for document parsing, chunking and embedding."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

authors = [
    { name = "Siddartha Nath" }
]

keywords = ["parse", "chunk", "embed", "retrieve", "rag"]

dependencies = [
    "pydantic>=2.0",
    "tiktoken",
]

[project.optional-dependencies]
pdf = ["pymupdf", "pymupdf-layout"]
docx = ["python-docx"]
pptx = ["python-pptx"]
html = ["beautifulsoup4", "httpx"]
markdown = ["markdown", "beautifulsoup4"]
chroma = ["chromadb"]
sqlite = ["sqlite-vec"]
pinecone = ["pinecone-client"]
openai = ["openai"]
anthropic = ["anthropic"]
google = ["google-genai"]
code = ["tree-sitter>=0.22", "tree-sitter-python"]
dev = ["pytest>=7.0", "pytest-cov", "pytest-asyncio"]
all = [
    "pymupdf",
    "pymupdf-layout",
    "python-docx",
    "python-pptx",
    "beautifulsoup4",
    "httpx",
    "markdown",
    "chromadb",
    "sqlite-vec",
    "pinecone-client",
    "openai",
    "anthropic",
    "google-genai",
    "tree-sitter>=0.22",
    "tree-sitter-python",
]

[project.scripts]
cleave = "cleave.cli:main"

[project.urls]
Homepage = "https://github.com/siddarthanath/cleave"

[tool.hatch.build.targets.wheel]
packages = ["cleave"]