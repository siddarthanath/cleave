[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cleave"
version = "0.1.0"
description = "A minimal unified Python interface for document parsing, chunking and embedding."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "tiktoken",
]

[project.optional-dependencies]
pdf       = ["pymupdf"]
docx      = ["python-docx"]
pptx      = ["python-pptx"]
html      = ["beautifulsoup4", "httpx"]
markdown  = ["markdown", "beautifulsoup4"]
chroma    = ["chromadb"]
sqlite    = ["sqlite-vec"]
pinecone  = ["pinecone-client"]
openai    = ["openai"]
anthropic = ["anthropic"]
google    = ["google-genai"]
dev       = ["pytest>=7.0", "pytest-cov", "pytest-asyncio"]
all       = [
    "cleave[pdf,docx,pptx,html,markdown,chroma,sqlite,pinecone,openai,anthropic,google]"
]

[project.scripts]
cleave = "cleave.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["cleave"]